<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}基于多模态数据与多智能体的专注度分析系统{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="container topbar-inner">
                <a class="brand" href="/">
                    <span class="brand-logo">
                        <img src="{{ url_for('static', path='logo.svg') }}" alt="系统标志" class="brand-logo-image">
                    </span>
                    <span class="brand-text-wrap">
                        <span class="brand-name">专注度分析系统</span>
                        <span class="brand-subtitle">多模态课堂状态分析</span>
                    </span>
                </a>
                <nav class="nav-panel">
                    <a class="nav-link-custom {% if active == 'index' %}active{% endif %}" href="/">首页</a>
                    <a class="nav-link-custom {% if active == 'analyze' %}active{% endif %}" href="/analyze">样本分析</a>
                    <a class="nav-link-custom {% if active == 'timeline' %}active{% endif %}" href="/timeline">时间序列分析</a>
                </nav>
            </div>
        </header>

        <main class="container page-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container">
                <div class="site-footer-text">© 基于多模态数据与多智能体的专注度分析系统</div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
