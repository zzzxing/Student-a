{% extends 'base.html' %}
{% block title %}首页 - 基于多模态数据与多智能体的专注度分析系统{% endblock %}
{% block content %}
<section class="hero-surface hero-surface-simple reveal-item" data-delay="0.03">
  <div class="hero-simple-inner hero-simple-centered">
    <div class="section-kicker">专注度分析系统</div>
    <h1 class="hero-title">基于多模态数据与多智能体的专注度分析系统</h1>
    <p class="hero-description hero-description-compact">融合视觉、语音与文本信息，支持单样本分析与时间序列分析。</p>
    <div class="hero-meta-row hero-meta-row-centered">
      <span class="hero-pill">视觉 / 语音 / 文本</span>
      <span class="hero-pill">单样本分析</span>
      <span class="hero-pill">时间序列分析</span>
    </div>
  </div>
</section>

<section class="product-entry-grid product-entry-grid-two product-entry-grid-balanced mt-4">
  <article class="entry-card entry-card-home reveal-item" data-delay="0.10">
    <div class="entry-card-top">
      <div class="entry-icon entry-icon-sample" aria-hidden="true">
        <span class="entry-icon-frame"></span>
        <span class="entry-icon-node entry-icon-node-a"></span>
        <span class="entry-icon-node entry-icon-node-b"></span>
        <span class="entry-icon-node entry-icon-node-c"></span>
      </div>
      <div class="entry-body">
        <h2 class="entry-title">单样本分析</h2>
        <p class="entry-description">展示类别、得分、分析说明、一致性说明与反馈建议。</p>
      </div>
    </div>
    <div class="entry-footer entry-footer-single">
      <a href="/analyze" class="btn btn-primary-soft w-100">开始分析</a>
    </div>
  </article>

  <article class="entry-card entry-card-home reveal-item" data-delay="0.16">
    <div class="entry-card-top">
      <div class="entry-icon entry-icon-timeline" aria-hidden="true">
        <span class="entry-icon-axis entry-icon-axis-x"></span>
        <span class="entry-icon-axis entry-icon-axis-y"></span>
        <span class="entry-icon-line entry-icon-line-a"></span>
        <span class="entry-icon-line entry-icon-line-b"></span>
        <span class="entry-icon-point entry-icon-point-a"></span>
        <span class="entry-icon-point entry-icon-point-b"></span>
      </div>
      <div class="entry-body">
        <h2 class="entry-title">时间序列分析</h2>
        <p class="entry-description">展示折线图、时间片摘要与详细分析内容。</p>
      </div>
    </div>
    <div class="entry-footer entry-footer-single">
      <a href="/timeline" class="btn btn-primary-soft w-100">开始分析</a>
    </div>
  </article>
</section>
{% endblock %}
