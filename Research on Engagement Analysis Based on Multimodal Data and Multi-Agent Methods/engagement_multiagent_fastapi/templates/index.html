{% extends 'base.html' %}
{% block title %}E-Focus 首页{% endblock %}
{% block content %}
<section class="hero-surface hero-surface-simple reveal-item" data-delay="0.03">
  <div class="hero-simple-inner hero-simple-centered">
    <div class="section-kicker">AI 教学辅助系统</div>
    <h1 class="hero-title">E-Focus：课堂动态专注度分析与可解释干预</h1>
    <p class="hero-description hero-description-compact">课堂行为数据输入 → 多模态分析 → 动态衰减预测 → AI 干预建议 → 课后叙事报告。</p>
  </div>
</section>

<section class="summary-grid mt-4">
  <div class="summary-card"><div class="stat-label">当前数据集</div><div class="stat-value">{{ dashboard.dataset_id }}</div></div>
  <div class="summary-card"><div class="stat-label">班级平均专注度</div><div class="stat-value">{{ dashboard.avg_focus }}</div></div>
  <div class="summary-card"><div class="stat-label">风险预警学生</div><div class="stat-value">{{ dashboard.risk_students }}</div></div>
</section>
{% endblock %}
